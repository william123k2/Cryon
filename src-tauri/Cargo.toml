[package]
name = "cryon"
version = "0.2.0"
description = "Cryon Minecraft Launcher"
authors = ["Cryon"]
edition = "2021"
default-run = "cryon"

[lib]
name = "cryon_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "io-util", "sync", "time", "macros"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
rfd = "0.15"

[profile.release]
opt-level = "s"
codegen-units = 16
lto = false
strip = "symbols"
